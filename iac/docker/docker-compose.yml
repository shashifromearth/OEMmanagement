version: "3.9"
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
    volumes: ["sql-data:/var/opt/mssql"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--replica-read-only", "no"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]

  gateway:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.Gateway
        DLL: Car.Gateway.dll
    environment:
      SQL_CONNECTION: "Server=sql,1433;Database=CarOps;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      REDIS_CONNECTION: redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      AGENT_RUNTIME_URL: http://agent-runtime:8088
    ports: ["8080:8080"]
    depends_on: [sql, redis, kafka, orchestrator]

  orchestrator:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.Orchestrator
        DLL: Car.Orchestrator.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      SQL_CONNECTION: "Server=sql,1433;Database=CarOps;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      REDIS_CONNECTION: redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      AGENT_RUNTIME_URL: http://agent-runtime:8088
      TOOL_EXECUTOR_URL: http://tool-executor:8080
    ports: ["5080:8080"]
    depends_on: [sql, redis, kafka, agent-runtime, tool-executor]

  llm-router:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.LlmRouter
        DLL: Car.LlmRouter.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports: ["5083:8080"]

  memory:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.Memory
        DLL: Car.Memory.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      REDIS_CONNECTION: redis:6379
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-https://localhost:8081}
      COSMOS_KEY: ${COSMOS_KEY:-}
    ports: ["5081:8080"]

  tool-executor:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.ToolExecutor
        DLL: Car.ToolExecutor.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["5082:8080"]
    depends_on: [kafka]

  ingestion:
    build:
      context: ../..
      dockerfile: iac/docker/dotnet.Dockerfile
      args:
        PROJECT: Car.Ingestion
        DLL: Car.Ingestion.dll
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [kafka]

  agent-runtime:
    build:
      context: ../..
      dockerfile: iac/docker/agent-runtime.Dockerfile
    environment:
      TOOL_EXECUTOR_URL: http://tool-executor:8080
      KAFKA_BOOTSTRAP: kafka:9092
      LLM_ROUTER_URL: http://llm-router:8080
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:-}
      AZURE_SEARCH_KEY: ${AZURE_SEARCH_KEY:-}
    ports: ["8088:8088"]
    depends_on: [tool-executor, kafka]
    deploy:
      replicas: 2

volumes:
  sql-data:
  redis-data:
