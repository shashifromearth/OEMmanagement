apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: car-agentic
spec:
  replicas: 3
  selector:
    matchLabels: { app: agent-runtime }
  template:
    metadata:
      labels: { app: agent-runtime }
    spec:
      containers:
        - name: agent-runtime
          image: caracr.azurecr.io/agent-runtime:1.0.0
          ports: [{ containerPort: 8088 }]
          envFrom:
            - configMapRef: { name: car-config }
            - secretRef: { name: car-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8088 }
          resources:
            requests: { cpu: 400m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: car-agentic
spec:
  selector: { app: agent-runtime }
  ports: [{ port: 8088, targetPort: 8088 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-runtime-pdb
  namespace: car-agentic
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: agent-runtime }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-runtime-hpa
  namespace: car-agentic
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-runtime }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 55 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: car-agentic
spec:
  replicas: 2
  selector:
    matchLabels: { app: llm-router }
  template:
    metadata:
      labels: { app: llm-router }
    spec:
      containers:
        - name: llm-router
          image: caracr.azurecr.io/llm-router:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: car-config }
            - secretRef: { name: car-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  namespace: car-agentic
spec:
  selector: { app: llm-router }
  ports: [{ port: 5083, targetPort: 8080 }]
